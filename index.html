<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jamaica Vacation</title>
<meta name="description" content="Plan a Jamaica trip from Dallas: live flight searches, all-inclusive resorts, villas, and gated-community Airbnbs. Informational only — this app never books or pays.">
<meta name="theme-color" content="#0b1f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jamaica Vacation">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stickyhead">
  <header class="topbar">
    <a href="#/" class="brand"><img src="icons/icon-192.png" alt="" width="36" height="36"><span>Jamaica Vacation</span></a>
    <nav class="top-nav" aria-label="Main">
      <a href="#/" data-route="home">Home</a>
      <a href="#/flights" data-route="flights">Flights</a>
      <a href="#/areas" data-route="areas">Areas</a>
      <a href="#/stays" data-route="stays">Stays</a>
      <a href="#/saved" data-route="saved">Shortlist</a>
      <a href="#/more" data-route="more">More</a>
    </nav>
    <span class="grow"></span>
  </header>
  <div class="flagline" aria-hidden="true"></div>
  <div id="tripSummary" class="tripbar" aria-label="Current trip"></div>
</div>
<main id="view" class="layout view" tabindex="-1"></main>
<nav class="tabbar" aria-label="Quick">
  <a href="#/" data-route="home"><span class="ico">🏠</span>Home</a>
  <a href="#/flights" data-route="flights"><span class="ico">✈</span>Flights</a>
  <a href="#/areas" data-route="areas"><span class="ico">🗺</span>Areas</a>
  <a href="#/stays" data-route="stays"><span class="ico">🏨</span>Stays</a>
  <a href="#/more" data-route="more"><span class="ico">☰</span>More</a>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
}
</script>
</body>
</html>
